<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1300" role="img" aria-label="Art direction OREC — silk and light">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe6d8"/>
      <stop offset=".55" stop-color="#e2d2bd"/>
      <stop offset="1" stop-color="#cdb9a0"/>
    </linearGradient>
    <radialGradient id="navy" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#1e5b8f"/>
      <stop offset=".55" stop-color="#123f63"/>
      <stop offset="1" stop-color="#0e3557"/>
    </radialGradient>
    <linearGradient id="silk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8f2" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#f3eee4" stop-opacity=".35"/>
      <stop offset="1" stop-color="#d8bc8a" stop-opacity=".25"/>
    </linearGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
    <filter id="blur2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1000" height="1300" fill="url(#bg)"/>
  <ellipse cx="740" cy="380" rx="380" ry="440" fill="url(#navy)" opacity=".92" filter="url(#blur)"/>
  <ellipse cx="220" cy="980" rx="330" ry="300" fill="#b9914f" opacity=".26" filter="url(#blur)"/>
  <ellipse cx="560" cy="720" rx="260" ry="220" fill="#fbf8f2" opacity=".5" filter="url(#blur2)"/>
  <path d="M-80 1010C160 830 330 900 470 760S760 520 1080 640V1320H-80Z" fill="url(#silk)" opacity=".72"/>
  <path d="M-40 760C170 690 330 760 480 630" fill="none" stroke="#fbf8f2" stroke-width="1.4" opacity=".55"/>
  <path d="M60 1180C300 1050 420 1120 560 980" fill="none" stroke="#b9914f" stroke-width="1" opacity=".45"/>
  <g fill="none" stroke="#d8bc8a" opacity=".5">
