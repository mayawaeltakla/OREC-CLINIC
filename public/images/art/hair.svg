      <path d="M340 0C390 250 320 470 430 680S540 950 510 1100" stroke-width="1.6"/>
      <path d="M470 0C520 230 450 460 560 670S670 960 630 1100" stroke-width="1.1"/>
      <path d="M600 0C650 260 580 470 690 690S790 980 750 1100" stroke-width="1.5"/>
      <path d="M720 0C770 240 700 460 810 660S880 960 860 1100" stroke-width="1"/>
    </g>
    <g stroke="#fbf8f2" opacity=".22">
