    <ellipse cx="450" cy="500" rx="184" ry="258" transform="rotate(-12 450 500)"/>
    <ellipse cx="450" cy="500" rx="146" ry="214" transform="rotate(-12 450 500)"/>
    <ellipse cx="450" cy="500" rx="106" ry="168" transform="rotate(-12 450 500)"/>
  </g>
  <g fill="none" stroke="#fbf8f2" opacity=".55">
