  <path d="M180 1080C180 790 300 720 420 620S600 450 560 240 650 60 780 60" fill="none" stroke="#fbf8f2" stroke-width="1.4" opacity=".4"/>
  <path d="M90 980C240 880 330 930 430 830S620 700 760 760" fill="none" stroke="#b9914f" stroke-width="1.4" opacity=".8"/>
  <path d="M80 1040C250 940 350 990 450 890S640 760 790 820" fill="none" stroke="#fbf8f2" stroke-width="1" opacity=".45"/>
  <g fill="none" stroke="#101f33" opacity=".18">
