    <circle cx="450" cy="550" r="380"/>
  </g>
  <text x="450" y="1010" text-anchor="middle" font-family="Chapaza, Georgia, serif" font-style="normal" font-size="24" fill="#fbf8f2" opacity=".7" letter-spacing="1">BODY · FORM</text>
  <path d="M0 0h900v1100H0z" filter="url(#grain)" opacity=".09"/>
