<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" role="img" aria-label="OREC body aesthetics art — sculpted line">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe6d8"/>
      <stop offset="1" stop-color="#d8c4ab"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e5b8f"/>
      <stop offset=".6" stop-color="#0e3557"/>
      <stop offset="1" stop-color="#101f33"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="60"/></filter>
