<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" role="img" aria-label="OREC dental art — the smile arc">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf8f2"/>
      <stop offset="1" stop-color="#e9ddcb"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e5b8f"/>
      <stop offset="1" stop-color="#0e3557"/>
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e5b8f" stop-opacity="0"/>
      <stop offset="1" stop-color="#1e5b8f" stop-opacity=".16"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="900" height="1100" fill="url(#bg)"/>
  <ellipse cx="450" cy="300" rx="330" ry="240" fill="#d8bc8a" opacity=".22" filter="url(#blur)"/>
  <rect y="720" width="900" height="380" fill="url(#wash)"/>
  <g fill="none" stroke="#1e5b8f" opacity=".26">
    <path d="M120 690Q450 1010 780 690" stroke-width="1.2"/>
    <path d="M160 660Q450 940 740 660" stroke-width="1.2"/>
    <path d="M200 630Q450 870 700 630" stroke-width="1.2"/>
    <path d="M60 720Q450 1080 840 720" stroke-width="1.2"/>
  </g>
  <path d="M150 610Q450 900 750 610" fill="none" stroke="url(#blue)" stroke-width="34" stroke-linecap="round" opacity=".95"/>
  <path d="M150 610Q450 900 750 610" fill="none" stroke="#fbf8f2" stroke-width="1" opacity=".35"/>
  <path d="M190 570Q450 810 710 570" fill="none" stroke="#b9914f" stroke-width="1.4" opacity=".85"/>
  <g fill="#b9914f">
    <circle cx="450" cy="742" r="5"/>
    <circle cx="150" cy="610" r="3"/>
    <circle cx="750" cy="610" r="3"/>
  </g>
  <g fill="none" stroke="#101f33" opacity=".18">
    <path d="M450 90v250"/>
    <path d="M420 120h60"/>
  </g>
  <text x="450" y="200" text-anchor="middle" font-family="Chapaza, Georgia, serif" font-style="normal" font-size="26" fill="#0e3557" opacity=".55" letter-spacing="1">OREC DENTAL</text>
  <path d="M0 0h900v1100H0z" filter="url(#grain)" opacity=".08"/>
</svg>
