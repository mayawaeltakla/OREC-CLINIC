<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" role="img" aria-label="OREC clinic art — Istanbul arches">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe6d8"/>
      <stop offset=".5" stop-color="#e0d0bb"/>
      <stop offset="1" stop-color="#c8b49a"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf8f2" stop-opacity=".95"/>
      <stop offset="1" stop-color="#f3eee4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e3557" stop-opacity=".05"/>
      <stop offset="1" stop-color="#0e3557" stop-opacity=".75"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1000" height="1200" fill="url(#bg)"/>
  <ellipse cx="520" cy="380" rx="420" ry="300" fill="#fbf8f2" opacity=".5" filter="url(#blur)"/>
  <g fill="none" stroke="#0e3557">
    <path d="M150 1040V560c0-140 115-250 250-250s250 110 250 250v480" stroke-width="2" opacity=".55"/>
    <path d="M250 1040V600c0-90 68-160 150-160s150 70 150 160v440" stroke-width="1.4" opacity=".4"/>
    <path d="M350 1040V640c0-40 28-70 50-70s50 30 50 70v400" stroke-width="1" opacity=".28"/>
  </g>
  <path d="M150 560c0-140 115-250 250-250s250 110 250 250" fill="none" stroke="#b9914f" stroke-width="1.2" opacity=".8"/>
  <path d="M400 1040V600" stroke="#b9914f" stroke-width="1" opacity=".45"/>
  <rect x="390" y="380" width="20" height="20" fill="none" stroke="#b9914f" opacity=".7"/>
  <path d="M0 1040h1000v160H0z" fill="url(#deep)"/>
  <g fill="none" stroke="#0e3557" opacity=".45">
    <path d="M700 980c40-70 110-90 160-60s60 100 20 150" stroke-width="1.2"/>
    <path d="M720 1000c30-50 85-65 120-45s45 75 15 110" stroke-width="1"/>
