    <ellipse cx="450" cy="540" rx="300" ry="180" stroke-width="2" opacity=".9"/>
    <ellipse cx="450" cy="540" rx="236" ry="138" stroke-width="1.4" opacity=".6"/>
    <ellipse cx="450" cy="540" rx="172" ry="98" stroke-width="1" opacity=".42"/>
    <ellipse cx="450" cy="540" rx="108" ry="60" stroke-width="1" opacity=".3"/>
  </g>
  <path d="M60 540h780" stroke="#b9914f" stroke-width="1" opacity=".6"/>
  <circle cx="450" cy="540" r="26" fill="#0e3557"/>
