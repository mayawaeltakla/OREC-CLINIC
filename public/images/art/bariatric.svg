  </defs>
  <rect width="900" height="1100" fill="url(#bg)"/>
  <ellipse cx="620" cy="760" rx="320" ry="280" fill="#b9914f" opacity=".22" filter="url(#blur)"/>
  <ellipse cx="260" cy="300" rx="240" ry="220" fill="#d8bc8a" opacity=".28" filter="url(#blur)"/>
